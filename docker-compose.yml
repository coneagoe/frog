# common variable & volume
x-postgres-common-env: &postgres-common-env
  POSTGRES_DB: quant
  POSTGRES_USER: quant
  POSTGRES_PASSWORD: quant

x-airflow-common-depends-on: &airflow-common-depends-on
  db:
    condition: service_healthy
  redis:
    condition: service_started
  db-init-airflow:
    condition: service_completed_successfully
  airflow-init-permissions:
    condition: service_completed_successfully

x-airflow-email-env: &airflow-email-env
  # Email (required; define these in .env)
  AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
  AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
  AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
  AIRFLOW__SMTP__SMTP_MAIL_FROM: ${SMTP_MAIL_FROM:?SMTP_MAIL_FROM is required}
  AIRFLOW__SMTP__SMTP_SSL: "true"
  AIRFLOW__SMTP__SMTP_STARTTLS: "false"
  ALERT_EMAILS: ${ALERT_EMAILS:?ALERT_EMAILS is required}
  # Repo email helper compatibility (utility.send_email)
  MAIL_SERVER: ${SMTP_HOST:?SMTP_HOST is required}
  MAIL_PORT: ${SMTP_PORT:?SMTP_PORT is required}
  MAIL_SENDER: ${SMTP_MAIL_FROM:?SMTP_MAIL_FROM is required}
  MAIL_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
  MAIL_RECEIVERS: ${ALERT_EMAILS:?ALERT_EMAILS is required}

# Airflow admin bootstrap (used by the one-time `airflow-init` profile).
# Keep password unset here; `airflow-init` will fail fast if it's missing.
x-airflow-admin-env: &airflow-admin-env
  AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
  AIRFLOW_ADMIN_FIRSTNAME: ${AIRFLOW_ADMIN_FIRSTNAME:-Admin}
  AIRFLOW_ADMIN_LASTNAME: ${AIRFLOW_ADMIN_LASTNAME:-User}
  AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}

# Common DB settings for all services that need database access
x-db-common-env: &db-common-env
  db_host: db
  db_port: 5432
  db_username: quant
  db_password: quant
  TUSHARE_TOKEN: ${TUSHARE_TOKEN:?TUSHARE_TOKEN is required in .env}

x-qg-proxy-env: &qg-proxy-env
  QG_PROXY_KEY: ${QG_PROXY_KEY:-}
  QG_PROXY_PWD: ${QG_PROXY_PWD:-}

x-proxy-pool-env: &proxy-pool-env
  PROXY_POOL_URL: http://proxy_pool:5010
  PROXY_PROVIDER: ${PROXY_PROVIDER:-auto}

x-airflow-common: &airflow-common
  image: frog-airflow:3.3.0-python3.12
  build:
    context: .
    dockerfile: airflow.Dockerfile
  user: "${AIRFLOW_UID:-1000}:0"
  environment:
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    # Airflow metadata DB (separate from business data DB)
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://quant:quant@db:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    # Use Redis for Celery task results (DB index 1) to reduce Postgres connection pressure.
    # Business data still writes to Postgres via storage layer; Airflow metadata remains in Postgres.
    AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/1
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-frog_airflow_jwt_secret_change_me}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-frog}
    # Preserve Airflow 2 cron data interval semantics for DAGs using data_interval_end.
    AIRFLOW__SCHEDULER__CREATE_CRON_DATA_INTERVALS: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Shanghai
    AIRFLOW__API__EXPOSE_CONFIG: "true"
    # Keep this identical across API server/scheduler/worker, otherwise log fetching can fail with
    # "serve_logs signature was wrong" due to presigned URL verification errors.
    # Override via .env/CI secrets in real deployments.
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW__API__SECRET_KEY:-frog_airflow_secret_key_change_me}
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # Cap Airflow SQLAlchemy connection usage (metadata DB) to avoid exhausting Postgres connections.
    # These apply to scheduler/webserver/worker processes.
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_SIZE: "5"
    AIRFLOW__DATABASE__SQL_ALCHEMY_MAX_OVERFLOW: "0"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_RECYCLE: "1800"
    AIRFLOW__DATABASE__SQL_ALCHEMY_POOL_PRE_PING: "true"
    # Stopgap: avoid frequent DAG parsing process kills when imports are slow.
    AIRFLOW__DAG_PROCESSOR__STALE_DAG_THRESHOLD: "300"
    AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "120"
    # When worker concurrency < active partitions, tasks can sit in "queued" for hours.
    # Default queued timeout is often too low and causes scheduler to mark them failed.
    AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT: "21600"  # 6 hours
    AIRFLOW__SCHEDULER__TASK_QUEUED_TIMEOUT_CHECK_INTERVAL: "60"
    # Long-running tasks: avoid false-positive zombie detection.
    AIRFLOW__SCHEDULER__SCHEDULER_ZOMBIE_TASK_THRESHOLD: "1800"
    # Limit Celery worker concurrency to prevent Postgres connection exhaustion.
    # Each worker process creates its own DB connection pool; too many workers = too many clients.
    AIRFLOW__CELERY__WORKER_CONCURRENCY: "2"
    # Prevent "Executor reports task instance finished (failed) although the task says it's queued":
    # Default prefetch_multiplier=4 causes each worker to pre-claim 4x tasks; if the worker is
    # OOM-killed, those pre-claimed tasks are marked FAILED by Celery while Airflow DB still shows
    # "queued", triggering the mismatch error. Setting to 1 ensures each worker slot holds exactly
    # 1 task at a time, so a worker crash affects at most 1 task per slot.
    AIRFLOW__CELERY__WORKER_PREFETCH_MULTIPLIER: "1"
    # Make project packages (common/, download/, stock/, etc.) importable from DAGs
    PYTHONPATH: /opt/airflow/frog
    FROG_PROJECT_ROOT: /opt/airflow/frog
    # Airflow history-download partitioning (DAG creates up to 16 tasks; this controls active partitions)
    DOWNLOAD_PROCESS_COUNT: ${DOWNLOAD_PROCESS_COUNT:-4}
    PAPER_TRADING_API_BASE_URL: http://paper-trading:8000
    PAPER_TRADING_API_TOKEN: ${PAPER_TRADING_API_TOKEN:?PAPER_TRADING_API_TOKEN is required in .env}
    <<: [*db-common-env, *qg-proxy-env, *proxy-pool-env, *airflow-email-env, *airflow-admin-env]
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./:/opt/airflow/frog
  depends_on: *airflow-common-depends-on

# Common environment variables for app and celery-worker services
x-app-common-env: &app-common-env
  <<: [*db-common-env, *qg-proxy-env, *proxy-pool-env]
  DATABASE_URL: postgresql://quant:quant@db:5432/quant
  REDIS_URL: redis://redis:6379/0

services:
  test_db:
    image: timescale/timescaledb:latest-pg16
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      <<: *postgres-common-env
    ports: ["127.0.0.1:${TEST_DB_HOST_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - /var/lib/postgresql/data

  db:
    image: timescale/timescaledb:latest-pg16
    # Default max_connections for this image can be low; Airflow + workers can briefly spike.
    # Raise it to reduce "too many clients already" failures.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      <<: *postgres-common-env
    # SECURITY: bind Postgres to localhost only (avoid exposing 5432 to the internet).
    # If you need remote access, prefer VPN/SSH tunnel or a firewall allowlist.
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - ./docker/db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  # Ensure the Airflow metadata DB exists on every `docker compose up`.
  # This is necessary because /docker-entrypoint-initdb.d scripts run only
  # on first initialization of the data directory.
  db-init-airflow:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *postgres-common-env
      AIRFLOW_DB_NAME: airflow
      PGPASSWORD: quant
    restart: "no"
    command:
      - sh
      - -euc
      - |
        until pg_isready -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"; do
          sleep 1;
        done

        exists=$$(psql -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname='$$AIRFLOW_DB_NAME'" || true)
        if [ "$$exists" != "1" ]; then
          createdb -h db -U "$$POSTGRES_USER" -O "$$POSTGRES_USER" "$$AIRFLOW_DB_NAME"
        fi

  redis:
    image: redis:7-alpine
    # SECURITY: do not publish Redis to the host network.
    # Exposing 6379 publicly allows unauthenticated commands (e.g. REPLICAOF)
    # that can break Celery/Airflow. Containers can still reach Redis via the
    # internal Docker network name "redis".

  proxy_redis:
    image: redis:7-alpine
    volumes:
      - proxy_redis_data:/data

  proxy_pool:
    image: jhao104/proxy_pool@sha256:2a1511ef3f34388478acdd79eedd7f64d664e0efd9ce1af3c501a1a534d72aa3
    depends_on: [proxy_redis]
    environment:
      DB_CONN: redis://proxy_redis:6379/0
    entrypoint: ["tini", "--", "sh", "-c"]
    command:
      - |
        status_fifo=/tmp/proxy_pool_status
        mkfifo "$$status_fifo" || exit 1
        cleanup() {
          exit_status=$$?
          trap - EXIT INT TERM
          kill "$$server_pid" "$$schedule_pid" 2>/dev/null || true
          wait "$$server_pid" "$$schedule_pid" 2>/dev/null || true
          rm -f "$$status_fifo"
          exit "$$exit_status"
        }
        trap cleanup EXIT INT TERM
        (
          python proxyPool.py server
          status=$$?
          printf 'server %s\n' "$$status" >"$$status_fifo"
        ) &
        server_pid=$$!
        (
          python proxyPool.py schedule
          status=$$?
          printf 'schedule %s\n' "$$status" >"$$status_fifo"
        ) &
        schedule_pid=$$!
        IFS=' ' read -r process_name process_status <"$$status_fifo"
        exit "$$process_status"
    restart: unless-stopped

  app:
    build:
      context: .
    depends_on: [db, redis, proxy_pool]
    environment:
      <<: [*app-common-env, *airflow-email-env]

  paper-trading:
    build:
      context: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *db-common-env
      DATABASE_URL: postgresql://quant:quant@db:5432/quant
      FROG_ENV: ${FROG_ENV:?FROG_ENV is required for paper-trading}
      AUTH_REGISTRATION_ENABLED: ${AUTH_REGISTRATION_ENABLED:?AUTH_REGISTRATION_ENABLED is required for paper-trading}
      AUTH_PUBLIC_BASE_URL: ${AUTH_PUBLIC_BASE_URL:?AUTH_PUBLIC_BASE_URL is required for paper-trading}
      AUTH_OWNER_EMAIL: ${AUTH_OWNER_EMAIL:?AUTH_OWNER_EMAIL is required when paper accounts need ownership backfill}
      PAPER_TRADING_JWT_SECRET: ${PAPER_TRADING_JWT_SECRET:?PAPER_TRADING_JWT_SECRET is required for paper-trading}
      PAPER_TRADING_COOKIE_SECURE: ${PAPER_TRADING_COOKIE_SECURE:?PAPER_TRADING_COOKIE_SECURE is required for paper-trading}
      PAPER_TRADING_API_TOKEN: ${PAPER_TRADING_API_TOKEN:?PAPER_TRADING_API_TOKEN is required in .env}
    ports:
      - "8000:8000"
    command: ["uvicorn", "paper_trading.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]

  paper-trading-frontend:
    build:
      context: frontend/paper-trading
    depends_on: [paper-trading]
    environment:
      PAPER_TRADING_API_BASE_URL: http://paper-trading:8000
    ports:
      - "3000:3000"

  celery-worker:
    build:
      context: .
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=info"]
    depends_on: [db, redis, proxy_pool]
    environment:
      <<: *app-common-env
    profiles: ["worker"]

  airflow-init-permissions:
    image: busybox:latest
    user: root
    volumes:
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./dags:/opt/airflow/dags
    command:
      ["sh", "-c", "mkdir -p /opt/airflow/logs /opt/airflow/plugins /opt/airflow/dags && chown -R ${AIRFLOW_UID:-1000}:0 /opt/airflow/logs /opt/airflow/plugins /opt/airflow/dags && echo 'Permissions fixed successfully!'"]

  airflow-apiserver:
    <<: *airflow-common
    ports: ["8080:8080"]
    # Airflow 3 replaces the webserver command with the API server.
    command:
      ["api-server"]
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      proxy_pool:
        condition: service_started

  airflow-scheduler:
    <<: *airflow-common
    command:
      ["scheduler"]
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      proxy_pool:
        condition: service_started

  airflow-dag-processor:
    <<: *airflow-common
    command:
      ["dag-processor"]
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      proxy_pool:
        condition: service_started

  airflow-worker:
    <<: *airflow-common
    command:
      ["airflow", "celery", "worker"]
    depends_on:
      <<: *airflow-common-depends-on
      airflow-apiserver:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
      paper-trading:
        condition: service_started
      proxy_pool:
        condition: service_started

  airflow-init:
    <<: *airflow-common
    command:
      ["bash", "-c", "set -euo pipefail; if [ -z \"$$AIRFLOW_ADMIN_PASSWORD\" ]; then echo 'AIRFLOW_ADMIN_PASSWORD is required (set it in .env)'; exit 1; fi; airflow db migrate; airflow users create --username \"$$AIRFLOW_ADMIN_USERNAME\" --password \"$$AIRFLOW_ADMIN_PASSWORD\" --firstname \"$$AIRFLOW_ADMIN_FIRSTNAME\" --lastname \"$$AIRFLOW_ADMIN_LASTNAME\" --role Admin --email \"$$AIRFLOW_ADMIN_EMAIL\" || echo 'User already exists' "]
    restart: "no"

volumes:
  proxy_redis_data:
